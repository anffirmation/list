<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<link rel="shortcut icon" href="./favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
<link rel="manifest" href="./site.webmanifest" />
    <title>АНФфирмация</title>
    <style>
        :root {
            /* Темная тема */
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --imdb-color: #f5c518;
            --border-color: #333333;
            --muted-text: #9e9e9e;
            --link-color: #64b5f6;
        }

        html {
            scroll-behavior: smooth; /* Плавная прокрутка к якорям */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Шапка сайта */
        .site-header {
            display: flex;
            align-items: center;
            gap: 20px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .site-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }

        .main-title {
            margin: 0;
            font-size: 28px;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* Навигация (Хлебные крошки / Якоря) */
        .breadcrumbs {
            font-size: 18px;
            margin-bottom: 30px;
            color: var(--muted-text);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .breadcrumbs a {
            color: var(--link-color);
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 500;
        }

        .breadcrumbs a:hover {
            color: #90caf9;
            text-decoration: underline;
        }

        .breadcrumbs .separator {
            user-select: none;
			color: #cccccc;
        }

        /* Стили загрузчика */
        #loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid var(--link-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #content {
            display: none;
        }

        /* Стили категорий и карточек */
        .category-section {
            margin-bottom: 40px;
            scroll-margin-top: 20px; /* Отступ при якорной прокрутке */
        }

        .category-title {
            font-size: 24px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: #ffffff;
			text-transform: uppercase;
        }

        .series-card {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            overflow: hidden;
            transition: transform 0.2s;
			text-decoration:none;
			color:'white';
        }

        .series-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7);
        }

        .poster-container {
            flex-shrink: 0;
            width: 140px;
			height: 222px;
            background-color: #2c2c2c;
        }

        .poster-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .series-info {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .series-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .series-title {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
        }

        .series-year {
            color: var(--muted-text);
            font-size: 16px;
        }

        .series-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .imdb-icon {
            background-color: var(--imdb-color);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .series-plot {
            margin: 0;
            line-height: 1.5;
            color: #cccccc;
            font-size: 15px;
        }

        /* Кнопка наверх */
        #scrollTopBtn {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99;
            font-size: 24px;
            border: none;
            outline: none;
            background-color: var(--card-bg);
            color: var(--link-color);
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s, transform 0.2s;
            line-height: 0;
        }

        #scrollTopBtn:hover {
            background-color: var(--border-color);
            transform: scale(1.1);
        }

        @media (max-width: 600px) {
            .site-header {
                flex-direction: column;
                text-align: center;
            }
            .main-title {
                font-size: 22px;
            }
            .series-card {
                flex-direction: column;
            }
            .poster-container {
                width: 100%;
                height: 300px;
            }
            .breadcrumbs {
                font-size: 14px;
                gap: 6px;
            }
        }
		.d-none{
			display:none !important;
		}
    </style>
	<!-- Google tag (gtag.js) -->

</script>
</head>
<body>

    <div id="loader-container">
        <div class="spinner"></div>
        <div>Загрузка данных...</div>
    </div>

    <div class="container" id="content">
        <!-- Шапка с логотипом и заголовком -->
        <header class="site-header">
            <img src="обложка ютуб новая.jpg" alt="Логотип АНФфирмация" class="site-logo">
            <h1 class="main-title">ТОП сериалов АНФфирмация</h1>
        </header>

        <!-- Контейнер для динамических ссылок на категории -->
        <nav class="breadcrumbs" id="breadcrumbs"></nav>
        
        <!-- Контейнер для списков -->
        <div id="categories-container"></div>
    </div>

    <!-- Кнопка прокрутки наверх -->
    <button id="scrollTopBtn" title="Наверх">&#8679;</button>

    <script>
        const DATA_URL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTS_fwNg5dvoOJBvu3JLsP1ecSInOpbVye416hJB8qd4X2JSQ0QFGJWfVKVK_9fjqD54lw6Phcjon7gg4rQG8WiQkloqik_dD5Y9kSMdmdV1zalBxWjHSLCAdB3g4M7BA33_T-IQRzUC_0BnGRJGKZ0auw1wAgfnPU7V-sLXofXuqy2Xt5yzKvVTT98fb1S6M0wYRP-KS9QH1_dIqThqTmrjbhZhKbODEzjpV8mHlRXSOkstmf4HvoAJBVoWhD434SWQC-_wjhhsgqC9MiGNqC-Xzy4Yw&lib=MTxAziyImlhTIhNl9hwlnAbMPylP4P88t';

        document.addEventListener('DOMContentLoaded', () => {
            fetchDataAndRender();
        });

        async function fetchDataAndRender() {
            const loaderContainer = document.getElementById('loader-container');
            const contentContainer = document.getElementById('content');
            const breadcrumbsNav = document.getElementById('breadcrumbs');
            const categoriesContainer = document.getElementById('categories-container');

            try {
                const response = await fetch(DATA_URL);
                if (!response.ok) throw new Error('Сетевая ошибка при запросе');
                
                const jsonData = await response.json();
                const data = jsonData.data;
                
                renderContent(data, breadcrumbsNav, categoriesContainer);
                
                loaderContainer.style.display = 'none';
                contentContainer.style.display = 'block';

            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                loaderContainer.innerHTML = `<div style="color: #ef5350; font-weight: bold;">Ошибка загрузки данных. Пожалуйста, проверьте консоль или ссылку на JSON.</div>`;
            }
        }

        function renderContent(data, breadcrumbsNav, categoriesContainer) {
            data.forEach((categoryObj, index) => {
                const categoryId = `category-${index}`;

                // 1. Создание ссылки в хлебных крошках
                const link = document.createElement('a');
                link.href = `#${categoryId}`;
                link.textContent = categoryObj.category;
                breadcrumbsNav.appendChild(link);

                // Добавление разделителя, если это не последний элемент
                if (index < data.length - 1) {
                    const separator = document.createElement('span');
                    separator.className = 'separator';
                    separator.textContent = '/';
                    breadcrumbsNav.appendChild(separator);
                }

                // 2. Создание секции категории
                const section = document.createElement('div');
                section.className = 'category-section';
                section.id = categoryId; // Якорь для прокрутки

                const categoryHeader = document.createElement('h2');
                categoryHeader.className = 'category-title';
                categoryHeader.textContent = categoryObj.category;
                section.appendChild(categoryHeader);

                // 3. Заполнение секции карточками
                categoryObj.items.forEach(item => {
                    const card = document.createElement('a');
					card.href = `https://www.imdb.com/${(item.id.includes('nm') ? 'name/' : 'title/')+ item.id}/`;
					card.target = "_blank";
                    card.className = 'series-card';
					if(item.rating !== ''){
						item.rating = (item.rating % parseInt(item.rating) == 0) ? item.rating + '.0' : item.rating;
					}
                    card.innerHTML = `
                        <div class="poster-container">
                            <img src="${item.poster || ''}" alt="Постер ${item.title}" loading="lazy">
                        </div>
                        <div class="series-info">
                            <div class="series-header">
                                <h3 class="series-title">${item.title} ${item.engTitle !== '' ? '/ '+ item.engTitle : ''}</h3>
                                <span class="series-year${item.year !== '' ? '' : ' d-none'}">(${item.year})</span>
                            </div>
                            <div class="series-rating${item.rating !== '' ? '' : ' d-none'}">
                                <span class="imdb-icon">IMDb</span>
                                <span>${item.rating}</span>
                            </div>
                            <p class="series-plot">${item.plot}</p>
                        </div>
                    `;
                    
                    section.appendChild(card);
                });

                categoriesContainer.appendChild(section);
            });
        }

        // Логика кнопки "Наверх"
        const scrollTopBtn = document.getElementById("scrollTopBtn");

        window.addEventListener('scroll', () => {
            // Показываем кнопку, если прокрутили больше 300 пикселей
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                scrollTopBtn.style.display = "block";
            } else {
                scrollTopBtn.style.display = "none";
            }
        });

        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth' // Плавная прокрутка
            });
        });
    </script>
</body>
</html>
